# ============================================================
# Пути (все обязательные — прописывает пользователь)
# ============================================================
teaser_bin:     /home/alex/Geoscan/libs/TEASER-plusplus/my_tools/build/teaser_register
checkpoint_dir: ../checkpoints
output_dir:     ../output

# ============================================================
# Параметры TEASER++
# ============================================================
teaser:
  voxel:        0.3
  noise_bound:  0.5

# ============================================================
# Параметры слияния
# ============================================================
merge:
  prob_threshold:    0.5      # порог вероятности сети
  fsv_rate_hard_max: 0.95     # жёсткий отсев по FSV до вызова сети
  fsv_max_poses:     100
  fsv_max_rays:      30
  max_iterations:    15

# ============================================================
# Сессии: одна запись = пара (облако + траектория)
